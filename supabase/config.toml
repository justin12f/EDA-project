# Supabase local development.
#   supabase start   brings up Postgres, Auth, Storage and the Studio
#   supabase db push applies supabase/migrations to a linked remote project
#
# Everything here mirrors what a hosted project needs, so what you test locally
# is what you deploy.

project_id = "lumen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
# Session mode, not transaction mode: the API sets RLS identity with SET LOCAL,
# which the transaction pooler does not carry between statements.
pool_mode = "session"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
# Catches outbound mail locally, so email confirmation can be tested without
# wiring a real SMTP provider.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "512MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so the end-to-end test can sign up and act immediately.
# Turn this ON in every hosted environment.
enable_confirmations = false

[auth.external.github]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = "http://localhost:54321/auth/v1/callback"

[analytics]
enabled = false
