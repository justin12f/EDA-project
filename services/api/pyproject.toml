[project]
name = "lumen-api"
version = "0.1.0"
description = "Lumen API — agentic data cleaning, pipelines and EDA."
requires-python = ">=3.11"
dependencies = [
  "lumen-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "redis>=5.2",
  "arq>=0.26",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "supabase>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "asgi-lifespan>=2.1",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_api"]

[tool.uv.sources]
lumen-engine = { path = "../../engine", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a live Supabase project and Redis"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
