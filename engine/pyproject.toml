[project]
name = "lumen-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "python-dotenv>=1.0",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
